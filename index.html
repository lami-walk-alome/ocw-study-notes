<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCW 전자·기계·소프트웨어 학습 노트</title>
<style>
:root{
  --purple:#6C31E3;      /* 중심 노트: 옵시디언 퍼플 */
  --black:#1E1E1E;       /* 기본 노트: 옵시디언 블랙 */
  --sky:#0EA5E9; --blue:#1D4ED8; --red:#DC2626; --deep:#4C1D95;
  --line:#E4DDF8; --soft:#F6F2FE; --text2:#3B3558;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--black);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.65;font-size:15px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
header.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header.top .brand{font-weight:800;font-size:17px;color:var(--black);letter-spacing:-.2px}
header.top .brand i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--purple);margin-right:8px;vertical-align:-1px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 56px)}
aside{border-right:1px solid var(--line);padding:16px 14px;position:sticky;top:56px;align-self:start;height:calc(100vh - 56px);overflow:auto}
main{padding:24px 32px 64px;max-width:1100px;width:100%}
#q{width:100%;padding:9px 11px;border:1px solid var(--black);border-radius:8px;font-size:14px;font-family:inherit;outline:none}
#q:focus{border-color:var(--purple);box-shadow:0 0 0 2px var(--line)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.fbtn{border:1px solid var(--black);background:#fff;color:var(--black);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.fbtn.on{background:var(--black);color:#fff}
.clist a{display:block;padding:8px 10px;border-radius:8px;color:var(--black);text-decoration:none;border-bottom:1px solid #fff}
.clist a:hover,.clist a.cur{background:var(--soft)}
.clist .ct{font-weight:700;font-size:14px}
.clist .cs{font-size:12px;color:var(--text2)}
.clist .hubmark{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--purple);margin-right:6px}
.clist .nodemark{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--black);margin-right:6px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;border:1px solid currentColor;margin-right:5px;background:#fff}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.4px}
h2{font-size:18px;margin:34px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--black)}
p.lead{color:var(--text2);margin:6px 0 16px}
.graphbox{border:1px solid var(--line);border-radius:12px;background:#fff;position:relative;overflow:hidden}
.graphbox svg{display:block;width:100%;height:auto;touch-action:none}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;padding:10px 14px;border-top:1px solid var(--line);color:var(--text2)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.path{margin:6px 0 10px}
.path b{display:inline-block;min-width:64px}
.path a{display:inline-block;padding:2px 9px;border:1px solid var(--black);border-radius:8px;color:var(--black);margin:3px 0}
.path a:hover{background:var(--black);color:#fff;text-decoration:none}
.path span.ar{margin:0 6px;color:var(--purple);font-weight:700}
.back{font-size:13.5px}
.code{color:var(--purple);font-weight:800;margin-right:8px}
.meta{color:var(--text2);margin:2px 0 8px}
.lnk{display:inline-block;margin:4px 8px 4px 0;padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:600;border:1px solid var(--black);color:var(--black);background:#fff}
.lnk:hover{text-decoration:none;background:var(--soft)}
.lnk.video{background:var(--purple);border-color:var(--purple);color:#fff}
.lnk.video:hover{background:#5624c0}
.lnk.page{border-color:var(--blue);color:var(--blue)}
.lnk small{font-weight:500;opacity:.85;margin-left:5px}
.grp{font-size:12.5px;font-weight:700;color:var(--text2);margin:12px 0 2px}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.rel{list-style:none;margin:0;padding:0}
.rel li{padding:9px 0;border-bottom:1px solid var(--line)}
.rel .tag{font-size:12px;font-weight:700;color:var(--purple)}
.rel .why{color:var(--text2);font-size:13.5px}
.tblwrap{overflow-x:auto}
table.weeks{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
table.weeks th{text-align:left;border-bottom:2px solid var(--black);padding:8px 10px;white-space:nowrap}
table.weeks td{border-bottom:1px solid var(--line);padding:10px;vertical-align:top}
table.weeks td.w{font-weight:800;white-space:nowrap}
table.weeks td.l{white-space:nowrap;color:var(--text2)}
table.weeks td.k{font-size:13px;color:var(--text2)}
.refchip{display:inline-block;margin:2px 4px 2px 0;padding:1px 8px;border:1px solid var(--purple);border-radius:999px;font-size:12.5px;color:var(--purple);background:#fff}
.refchip:hover{background:var(--purple);color:#fff;text-decoration:none}
.note{font-size:13px;color:var(--text2);margin-top:14px}
footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text2)}
svg text{font-family:inherit}
.gnode{cursor:pointer}
.gnode text{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.gedge{stroke:#CBBDF5;stroke-width:1.6}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:18px 16px 48px}
  .two{grid-template-columns:1fr}
}
</style>
</head>

    const g=el("g",{class:"gnode"},gn);
    el("circle",{r:n.r,fill:isHub(n.id)?"#6C31E3":"#1E1E1E"},g);
    drawLabel(g,n,isHub(n.id)?"#6C31E3":"#1E1E1E",isHub(n.id)?"800":"600");
    const tt=el("title",{},g);tt.textContent=C[n.id].title;
    n.g=g;
  });
  let alpha=1,drag=null,raf=null;
  const rep=Math.max(9000,n0*260);
  function step(a){
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const p=nodes[i],q=nodes[j];let dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy;
      if(d2<1){dx=(i-j)*.5;dy=.5;d2=1;}
      const d=Math.sqrt(d2),f=rep/d2*a,fx=dx/d*f,fy=dy/d*f;
      p.vx-=fx;p.vy-=fy;q.vx+=fx;q.vy+=fy;
    }
    links.forEach(l=>{
      const dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-120)*.025*a,fx=dx/d*f,fy=dy/d*f;
      l.s.vx+=fx;l.s.vy+=fy;l.t.vx-=fx;l.t.vy-=fy;
    });
    nodes.forEach(n=>{
      n.vx+=(W/2-n.x)*.002*a;n.vy+=(H/2-n.y)*.002*a;
      if(n!==drag){n.vx*=.78;n.vy*=.78;n.x+=n.vx;n.y+=n.vy;}else{n.vx=0;n.vy=0;}
    });
    resolveOverlaps(nodes,q=>q===drag,3);
    nodes.forEach(n=>{n.x=Math.max(n.hw+4,Math.min(W-n.hw-4,n.x));n.y=Math.max(n.r+6,Math.min(H-(n.oy+n.hh)-4,n.y));});
  }
  function draw(){
    links.forEach(l=>{l.el.setAttribute("x1",l.s.x);l.el.setAttribute("y1",l.s.y);l.el.setAttribute("x2",l.t.x);l.el.setAttribute("y2",l.t.y);});
    nodes.forEach(n=>n.g.setAttribute("transform",`translate(${n.x},${n.y})`));
  }
  function overlapCount(){let c=0;for(let a=0;a<nodes.length;a++)for(let b=a+1;b<nodes.length;b++){const p=nodes[a],q=nodes[b];if(p.hw+q.hw-Math.abs(q.x-p.x)>0&&p.hh+q.hh-Math.abs((q.y+q.oy)-(p.y+p.oy))>0)c++;}return c;}
  function place(){
    nodes.forEach((n,i)=>{const a=i/n0*2*Math.PI;n.x=W/2+Math.cos(a)*W*.38;n.y=H/2+Math.sin(a)*H*.38;n.vx=0;n.vy=0;});
    for(let i=0;i<500;i++)step(Math.max(.03,1-i/380));
    resolveOverlaps(nodes,null,400);
  }
  function outCount(){let c=0;nodes.forEach(n=>{if(n.x-n.hw<0||n.x+n.hw>W||n.y-n.r<0||n.y+n.oy+n.hh>H)c++;});return c;}
  // 화면 크기에 먼저 맞춰 배치하고, 겹침이 남으면 캔버스를 조금씩 키워 한 화면에 전부 보이게 축소
  place();let tries=0;
  while((overlapCount()>0||outCount()>0)&&tries<60){W*=1.06;H*=1.06;tries++;place();}
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.style.width="100%";svg.style.minWidth="0";svg.style.height=ch+"px";svg.style.margin="0";svg.style.maxWidth="100%";
  draw();
  function loop(){step(alpha);draw();alpha*=.96;if(alpha>.03||drag)raf=requestAnimationFrame(loop);else{raf=null;resolveOverlaps(nodes,null,60);nodes.forEach(n=>{n.x=Math.max(n.hw+2,Math.min(W-n.hw-2,n.x));n.y=Math.max(n.r+2,Math.min(H-(n.oy+n.hh)-2,n.y));});draw();}}
  function kick(a){alpha=Math.max(alpha,a);if(!raf)raf=requestAnimationFrame(loop);}
  function applyView(hover){
    const nb=hover?new Set([hover,...neighbors(hover).map(x=>x.id)]):null;
    nodes.forEach(n=>{n.g.style.opacity=(nb&&!nb.has(n.id))?.14:1;});
    links.forEach(l=>{
      const on=hover&&(l.e.a===hover||l.e.b===hover);
      l.el.setAttribute("stroke",on?"#6C31E3":"#CBBDF5");
      l.el.setAttribute("stroke-width",on?2.8:1.6);
      l.el.style.opacity=(hover&&!on)?.12:1;
    });
  }
  const toSvg=ev=>{const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());};
  nodes.forEach(n=>{
    n.g.addEventListener("mouseenter",()=>{if(!drag)applyView(n.id);});
    n.g.addEventListener("mouseleave",()=>{if(!drag)applyView(null);});
    n.g.addEventListener("pointerdown",ev=>{
      ev.preventDefault();
      drag=n;let moved=false;const start=toSvg(ev);
      kick(.5);
      const mv=e=>{const p=toSvg(e);if(Math.hypot(p.x-start.x,p.y-start.y)>4)moved=true;n.x=p.x;n.y=p.y;kick(.4);};
      const up=()=>{
        window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
        drag=null;
        if(!moved)go("#/c/"+n.id);
      };
      window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
    });
  });
  applyView(null);
  return {destroy(){if(raf)cancelAnimationFrame(raf);}};
}

/* ===== 로컬 그래프 (현재 과목을 중심에 둔 방사형, 겹침 방지) ===== */
function localGraph(svg,id){
  svg.innerHTML="";
  const nb=neighbors(id);
  const m=nb.length;
  const cx=0,cy=0;
  const rx=Math.max(200,m*26),ry=Math.max(150,m*19);
  const center={id,x:cx,y:cy,r:13,lines:wrapTitle(C[id].title,130)};boxOf(center);
  const nodes=nb.map((p,i)=>{const a=-Math.PI/2+i/m*2*Math.PI;
    const n={id:p.id,x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry,r:9,lines:wrapTitle(C[p.id].title,130)};boxOf(n);return n;});
  const all=[center,...nodes];
  resolveOverlaps(all,q=>q===center,300,10);
  const vb=fitBox(all,20);
  svg.setAttribute("viewBox",vb.join(" "));
  svg.style.width=Math.round(vb[2])+"px";svg.style.maxWidth="100%";svg.style.margin="0 auto";
  nodes.forEach(n=>el("line",{x1:cx,y1:cy,x2:n.x,y2:n.y,stroke:"#CBBDF5","stroke-width":1.8},svg));
  const draw=(n,color,bold)=>{
    const g=el("g",{class:"gnode",transform:`translate(${n.x},${n.y})`},svg);
    el("circle",{r:n.r,fill:color},g);
    drawLabel(g,n,bold?"#6C31E3":"#1E1E1E",bold?"800":"600",12.5);
    if(n.id!==id)g.addEventListener("click",()=>{go("#/c/"+n.id);});
  };
  nodes.forEach(n=>draw(n,"#1E1E1E",false));
  draw(center,"#6C31E3",true);
}

/* ===== 사이드바 ===== */
const filterCats=new Set();let query="";
function matches(c){
  if(filterCats.size&&!c.cats.some(k=>filterCats.has(k)))return false;
  if(!query)return true;
  const hay=[c.code,c.title,c.en,c.school,c.who,c.summary,...c.weeks.map(w=>w[2]+" "+w[3])].join(" ").toLowerCase();
  return query.toLowerCase().split(/\s+/).every(t=>hay.includes(t));
}
function renderSidebar(cur){
  const f=document.getElementById("filters");
  f.innerHTML=`<button class="fbtn ${filterCats.size?"":"on"}" data-c="">전체</button>`+Object.keys(CATS).map(k=>`<button class="fbtn ${filterCats.has(k)?"on":""}" data-c="${k}">${CATS[k].n}</button>`).join("");
  f.querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=b.dataset.c;if(!k)filterCats.clear();else if(filterCats.has(k))filterCats.delete(k);else filterCats.add(k);renderSidebar(currentId());rebuildGraph();});
  const list=Object.values(C).filter(matches);
  document.getElementById("clist").innerHTML=list.map(c=>`<a href="#/c/${c.id}" class="${c.id===cur?"cur":""}"><div class="ct"><span class="${isHub(c.id)?"hubmark":"nodemark"}"></span>${esc(c.title)}</div><div class="cs">${esc(c.school)} · ${esc(c.who)}</div></a>`).join("")||`<p class="cs" style="padding:8px">검색 결과가 없습니다.</p>`;
}
const visibleIds=()=>Object.values(C).filter(matches).map(c=>c.id);
let curRoute="";try{curRoute=location.hash||""}catch(e){}
const currentId=()=>{const m=curRoute.match(/^#\/c\/(\w+)/);return m&&C[m[1]]?m[1]:null;};
function go(r){curRoute=r;try{if(location.hash!==r)history.replaceState(null,"",r)}catch(e){}route();}
document.addEventListener("click",ev=>{const a=ev.target.closest&&ev.target.closest("a[href^='#/']");if(a){ev.preventDefault();go(a.getAttribute("href"));}});
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim();renderSidebar(currentId());rebuildGraph();});

/* ===== 화면 ===== */
const view=document.getElementById("view");
function rebuildGraph(){
  const svg=document.getElementById("g");if(!svg)return;
  if(mainGraph){mainGraph.destroy();mainGraph=null;}
  const ids=visibleIds();
  const idset=new Set(ids);
  const ec=E.filter(e=>idset.has(e.a)&&idset.has(e.b)).length;
  const cnt=document.getElementById("cnt");
  if(cnt)cnt.textContent=ids.length+"개 노트가 "+ec+"개의 관계로 연결되어 있습니다.";
  svg.innerHTML="";
  if(!ids.length){svg.setAttribute("viewBox","0 0 1300 200");const t=el("text",{x:650,y:100,"text-anchor":"middle","font-size":"16",fill:"#3B3558"},svg);t.textContent="조건에 맞는 노트가 없습니다.";return;}
  mainGraph=makeGraph(svg,ids);
}

  <footer>

    <b>중복 정리</b>: 같은 과목의 옛 판과 겹치는 내용은 최신판만 남겼습니다. 예) 6.832(Underactuated)·6.4210(조작) → Tedrake 채널의 최신판(2024·2023), 2.003J → 2.003SC, 6.041SC → RES.6-012, 6.0001·6.00SC → 6.100L, 6.042J → 6.1200J, 6.034(AI) → Stanford CS221, MIT 딥러닝 강의 → Stanford CS230, CS229(2018) → CS229(2026), CME295(2025) → CME295(2026), D4M → RES.LL-005, RES.6.007(1987) → 6.003, RES.6-001 → 6.013.<br>
    <b>빠진 것</b>: 영상이 데모·프로젝트 소개뿐이거나 정책 중심인 재생목록(6.007 실험, 16.01, 16.810, RES.ENV-007 등), 제목이 'Lec N'뿐이라 주제를 확인할 수 없는 일부 옛 강의(6.033, 6.035, 6.189)는 뺐습니다. 2.008, 2.14, 2.007, 6.012 등은 두 채널에 재생목록이 없어 넣지 못했습니다. 2.782J는 OCW 페이지에는 강의 영상이 있으나 유튜브 재생목록 주소는 찾지 못했습니다.<br>

    조사 기준일 2026-11-01.
  </footer>`;
  rebuildGraph();

}
function pathLinks(ids){return ids.map(id=>`<a href="#/c/${id}">${esc(C[id].title.split(" (")[0])}</a>`).join('<span class="ar">→</span>');}

function showCourse(id){
  if(mainGraph){mainGraph.destroy();mainGraph=null;}
  const c=C[id];
  const groups=[["video","강의 영상"],["notes","강의노트·교재"],["page","과목 페이지"]];
  const linkHtml=groups.map(([k,label])=>{
    const ls=c.links.filter(l=>l.k===k);
    return ls.length?`<div class="grp">${label}</div>`+ls.map(l=>`<a class="lnk ${k}" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}${l.s?"<small>검색</small>":""}</a>`).join(""):"";
  }).join("");
  const nb=neighbors(id);
  const relHtml=nb.map(n=>`<li><span class="tag">${n.tag}</span><br><a href="#/c/${n.id}"><b>${esc(C[n.id].title)}</b></a> <span class="cs">· ${esc(C[n.id].school)}</span><div class="why">${esc(n.why)}</div></li>`).join("");
  const rows=c.weeks.map(w=>`<tr><td class="w">${esc(w[0])}</td><td class="l">${esc(w[1])}</td><td>${esc(w[2])}</td><td class="k">${esc(w[3])}</td><td>${(w[4]||[]).map(r=>`<a class="refchip" href="#/c/${r[0]}" title="${esc(C[r[0]].title)}">${esc(C[r[0]].title)} · ${esc(r[1])}</a>`).join("")}</td></tr>`).join("");
  view.innerHTML=`
  <a class="back" href="#/">← 그래프로 돌아가기</a>
  <h1 style="margin-top:10px">${esc(c.title)}</h1>
  <div class="meta">${esc(c.school)} · ${esc(c.who)} · ${esc(c.term)} · ${esc(c.level)}</div>
  <div>${catChips(c)}${isHub(id)?'<span class="chip" style="color:var(--purple)">중심 노트</span>':""}</div>
  <p class="lead">${esc(c.summary)}</p>
  <h2>강의 자료</h2>
  ${linkHtml}
  <div class="two">
    <div><h2>연관 과목</h2><ul class="rel">${relHtml}</ul></div>
    <div><h2>로컬 그래프</h2><div class="graphbox"><svg id="lg"></svg></div></div>
  </div>

}

}
